name: Terraform IaC local

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Plan
        run: terraform plan -input=false -out=deployment.tfplan

      - name: Apply
        run: terraform apply -auto-approve deployment.tfplan

      - name: Vérifier la page web
        run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused "$(terraform output -raw app_access_url)"

      - name: Destroy
        if: always()
        run: terraform destroy -auto-approve -input=false
